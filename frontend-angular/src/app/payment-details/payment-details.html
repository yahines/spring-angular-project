<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Payment File</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <pdf-viewer
        *ngIf="pdfFileUrl"
        [src]="pdfFileUrl"
        [render-text]="true"
        [original-size]="false"
        [show-borders]="false"
        class="pdf-viewer"
        (after-load-complete)="afterLoadComplete($event)">
      </pdf-viewer>
    </mat-card-content>
  </mat-card>
</div>
